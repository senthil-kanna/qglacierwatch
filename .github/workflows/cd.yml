name: cd

# ALTERNATIVE TARGET (Azure Container Apps, infra/azure/). The primary deployment is AWS: the
# aws-deploy job in ci.yml and docs/aws-deployment.md.

# Manual deployment to Azure via OpenID Connect (no stored cloud secrets).
# Required repository variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
# AZURE_RESOURCE_GROUP, ALERT_EMAIL. See docs/deployment.md for the one-time setup.
on:
  workflow_dispatch:
    inputs:
      registry:
        description: "acr (private, ~USD 5/month) or ghcr (public image, free)"
        default: ghcr
        type: choice
        options: [ghcr, acr]

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # protect with required reviewers in repo settings
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Base infrastructure (no apps yet)
        id: base
        run: |
          out=$(az deployment group create -g "${{ vars.AZURE_RESOURCE_GROUP }}" -f infra/azure/main.bicep \
            -p infra/azure/main.parameters.json -p alertEmail="${{ vars.ALERT_EMAIL }}" \
               useAcr=${{ inputs.registry == 'acr' }} deployApps=false --query properties.outputs -o json)
          echo "acr=$(echo "$out" | jq -r .acrName.value)" >> "$GITHUB_OUTPUT"

      - name: Build and push image (ACR)
        if: inputs.registry == 'acr'
        run: az acr build -r "${{ steps.base.outputs.acr }}" -t qglacierwatch:${{ github.sha }} -f docker/Dockerfile .

      - name: Build and push image (GHCR, public)
        if: inputs.registry == 'ghcr'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          img=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build -f docker/Dockerfile -t "$img:${{ github.sha }}" .
          docker push "$img:${{ github.sha }}"

      - name: Deploy apps and jobs
        run: |
          az deployment group create -g "${{ vars.AZURE_RESOURCE_GROUP }}" -f infra/azure/main.bicep \
            -p infra/azure/main.parameters.json -p alertEmail="${{ vars.ALERT_EMAIL }}" \
               useAcr=${{ inputs.registry == 'acr' }} deployApps=true imageTag=${{ github.sha }} \
               externalImage=ghcr.io/${GITHUB_REPOSITORY,,} \
            --query properties.outputs -o json

      - name: Smoke test
        run: |
          url=$(az containerapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n qgw-api --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 20); do curl -fsS "https://$url/health" && exit 0; sleep 15; done
          echo "health check failed; roll back with: az containerapp revision list / activate the previous revision" && exit 1
