[project]
name = "qglacierwatch"
version = "0.1.0"
description = "Season-aware snowmelt discharge forecasting, glacial-lake monitoring and quantum-classical benchmarking for the Beas basin above Bhuntar"
requires-python = ">=3.12,<3.13"
readme = "README.md"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: trains neural or quantum models (deselect with -m 'not slow')",
    "network: needs Earth Engine or internet access",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "artifacts", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["src", "api"]
